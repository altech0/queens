<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'DM Sans', 'Trebuchet MS', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      color: #f0f4ff;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      color: #c8d0e8;
      max-width: 480px;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.button {
      background: #4f6ef7;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
    }

    a.button:hover {
      background: #3a5be0;
    }

    a.plain {
      color: #7a8499;
      font-size: 14px;
      text-decoration: none;
      align-self: center;
    }

    a.plain:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>★ Queens</h1>
  <p>A clean, calming puzzle game. No ads, no tracking, no nonsense.</p>
  <div class="links">
    <a class="button" href="https://apps.apple.com/app/queens" target="_blank">Download on the App Store</a>
    <a class="plain" href="/privacy">Privacy Policy</a>
  </div>
</body>
</html>
