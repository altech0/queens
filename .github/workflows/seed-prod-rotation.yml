name: Seed Prod Rotation

# Daily top-up of production, rotating through each puzzle type.
#
# The target database is hardcoded to prod and never taken from an input.
# seed-puzzles.yml resolves `inputs.env || 'prod'`, which is fine for a manual
# run but means a scheduled run with no inputs silently lands on prod; here
# there is nothing to default, so the target cannot drift.
#
# One combo per night on a six-day cycle. The thin, slow combos lead: Tangled
# generates roughly one board a second against Winding's fifty. 5x5 and 6x6 are
# left out of the rotation entirely — 5x5 yields the same 14 distinct solutions
# however long it runs, and 6x6 duplicates ~95% of what it generates, so a
# nightly slot for either would burn 50 minutes to insert nothing. Both remain
# available via workflow_dispatch.

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily, an hour before the dev rotation
  workflow_dispatch:
    inputs:
      combo:
        description: 'Which combo to seed'
        type: choice
        default: 'auto (rotate daily)'
        options:
          - 'auto (rotate daily)'
          - 'all combos (sequential)'
          - 'Tangled 9x9'
          - 'Tangled 8x8'
          - 'Winding 9x9'
          - 'Winding 8x8'
          - 'Original 8x8'
          - 'Original 10x10'
          - 'Original 6x6'
          - 'Original 5x5'
      seconds:
        description: 'Seconds to generate for'
        type: choice
        default: '3000'
        options:
          - '60'
          - '300'
          - '900'
          - '3000'

# One seeding run at a time: concurrent runs generate overlapping boards and
# waste most of their output on duplicate solutions.
#
# Note what this does NOT do: GitHub keeps only one *pending* run per group, so
# dispatching several combos back to back leaves the last one queued and cancels
# the rest — `cancel-in-progress: false` protects the running job, not the
# queue. To seed more than one combo in a single go, use the
# "all combos (sequential)" option, which loops inside one run.
concurrency:
  group: seed-prod-rotation
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Headroom for the worst case: "all combos (sequential)" at 3000s each is
    # eight 50-minute combos, so ~400 minutes of generating plus install and
    # uploads. A single-combo run finishes in about an hour regardless. GitHub
    # caps a job at 360 minutes, so an 8x3000s dispatch will be cut short — use
    # a smaller `seconds` for a full sweep, which is what it is for.
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve combos
        id: cfg
        run: |
          INPUT="${{ inputs.combo }}"

          # Emits one "engine size stars" line per combo to seed. A single combo
          # is just a one-line list, so the seed step below has one code path.
          combo_line() {
            case "$1" in
              'Tangled 9x9')    echo "snake-harden-v1 9 1"  ;;
              'Tangled 8x8')    echo "snake-harden-v1 8 1"  ;;
              'Winding 9x9')    echo "snake-v1 9 1"         ;;
              'Winding 8x8')    echo "snake-v1 8 1"         ;;
              'Original 8x8')   echo "voronoi-v2 8 1"       ;;
              'Original 10x10') echo "voronoi-v2 10 2"      ;;
              'Original 6x6')   echo "voronoi-v2 6 1"       ;;
              'Original 5x5')   echo "voronoi-v2 5 1"       ;;
              *) echo "ERROR: unknown combo '$1'" >&2; exit 1 ;;
            esac
          }

          if [ "${{ github.event_name }}" = "schedule" ] || [ "$INPUT" = "auto (rotate daily)" ] || [ -z "$INPUT" ]; then
            # Six-day rotation. Skips 5x5 and 6x6, which are saturated.
            DAY=$(date +%j)       # day of year, 001-366
            IDX=$((10#$DAY % 6))
            case $IDX in
              0) COMBOS="Tangled 9x9"    ;;
              1) COMBOS="Winding 9x9"    ;;
              2) COMBOS="Tangled 8x8"    ;;
              3) COMBOS="Winding 8x8"    ;;
              4) COMBOS="Original 8x8"   ;;
              5) COMBOS="Original 10x10" ;;
            esac
            RUN_SECONDS=3000      # 50 minutes
            combo_line "$COMBOS" > combos.txt
          elif [ "$INPUT" = "all combos (sequential)" ]; then
            # Every combo in one run. Dispatching them as separate runs does not
            # work: GitHub holds a single pending run per concurrency group, so
            # each dispatch cancels the one waiting behind it.
            #
            # 5x5 and 6x6 are included here but not in the nightly rotation —
            # a deliberate top-up may as well confirm they are still saturated,
            # where a nightly slot would just burn 50 minutes doing so.
            : > combos.txt
            for c in 'Tangled 9x9' 'Tangled 8x8' 'Winding 9x9' 'Winding 8x8' \
                     'Original 8x8' 'Original 10x10' 'Original 6x6' 'Original 5x5'; do
              combo_line "$c" >> combos.txt
            done
            RUN_SECONDS="${{ inputs.seconds }}"
          else
            combo_line "$INPUT" > combos.txt
            RUN_SECONDS="${{ inputs.seconds }}"
          fi

          echo "seconds=$RUN_SECONDS" >> $GITHUB_OUTPUT
          echo "count=$(wc -l < combos.txt)" >> $GITHUB_OUTPUT
          echo "Will seed $(wc -l < combos.txt) combo(s) at ${RUN_SECONDS}s each on PROD:"
          cat combos.txt

      - name: Generate and seed puzzles
        run: |
          FAILED=0
          # Read the list on fd 3, not stdin: the seed script opens a readline
          # interface on process.stdin, which would swallow the remaining lines
          # and end the loop after the first combo.
          while read -r ENGINE SIZE STARS <&3; do
            [ -z "$ENGINE" ] && continue
            echo "::group::$ENGINE ${SIZE}x${SIZE} ${STARS}-star"
            # One combo failing must not abandon the rest: a later combo may
            # still have plenty of room even if this one is saturated or its
            # upload failed. The step still fails at the end so the run is not
            # reported green.
            if ! (cd api && ../node_modules/.bin/tsx scripts/seedPuzzlesV2.ts \
                --env prod \
                --engine "$ENGINE" \
                --size "$SIZE" \
                --stars "$STARS" \
                --seconds ${{ steps.cfg.outputs.seconds }} \
                --yes); then
              echo "FAILED: $ENGINE ${SIZE}x${SIZE}"
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done 3< combos.txt
          [ "$FAILED" -eq 0 ] || { echo "$FAILED combo(s) failed"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          WRANGLER_SEND_METRICS: false

      - name: Report counts
        if: always()
        run: |
          cd api && ../node_modules/.bin/wrangler d1 execute queens --remote \
            --command "SELECT engine, grid_size, stars, n FROM puzzle_counts WHERE n > 0 ORDER BY engine, grid_size;" \
            || echo "Count query failed; the seeding result above is what matters."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
